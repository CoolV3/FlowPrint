services:
  docker-worker:
    build: ./docker-worker
    container_name: docker-worker
    privileged: true # Ermöglicht den Start des AppImages innerhalb von Docker
    environment:
      - CENTRAL_SERVER_URL=http://192.168.188.89:3000
      - USER_TOKEN=1234
    volumes:
      - ./docker-worker/output:/app/output
      - ./docker-worker/profiles:/app/profiles # Hier legst du deine Bambu-Profile ab
    restart: unless-stopped